<script>
(() => {
  const track = document.querySelector('.track');
  const strip = document.querySelector('.strip');
  if (!track || !strip) return;

  const items = [...track.children];
  const halfCount = Math.floor(items.length / 2);
  const firstSet = items.slice(0, halfCount);

  let x = 0;
  let lastTime = performance.now();
  let dragging = false;
  let pointerId = null;
  let startPointerX = 0;
  let startX = 0;
  let velocity = 0;
  let lastPointerX = 0;
  let lastPointerTime = 0;

  // Slow, subtle automatic motion.
  const autoSpeed = 18; // px/sec

  function firstSetWidth() {
    if (halfCount === 0) return 1;
    const first = firstSet[0].getBoundingClientRect();
    const last = firstSet[firstSet.length - 1].getBoundingClientRect();
    return Math.max(1, last.right - first.left);
  }

  function normalize() {
    const w = firstSetWidth();
    if (w <= 1) return;
    while (x <= -w) x += w;
    while (x > 0) x -= w;
  }

  function render() {
    track.style.transform = `translate3d(${x}px,0,0)`;
  }

  function frame(now) {
    const dt = Math.min(0.04, (now - lastTime) / 1000);
    lastTime = now;

    if (!dragging) {
      // Continue a short inertial movement after dragging, then return to slow auto-scroll.
      if (Math.abs(velocity) > 0.05) {
        x += velocity * dt;
        velocity *= Math.pow(0.055, dt);
      } else {
        velocity = 0;
        x -= autoSpeed * dt;
      }
      normalize();
      render();
    }
    requestAnimationFrame(frame);
  }

  track.addEventListener('pointerdown', (e) => {
    dragging = true;
    pointerId = e.pointerId;
    track.setPointerCapture(pointerId);
    startPointerX = e.clientX;
    startX = x;
    lastPointerX = e.clientX;
    lastPointerTime = performance.now();
    velocity = 0;
    track.style.cursor = 'grabbing';
  });

  track.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== pointerId) return;

    const now = performance.now();
    const dx = e.clientX - startPointerX;
    x = startX + dx;

    const elapsed = Math.max(1, now - lastPointerTime);
    velocity = (e.clientX - lastPointerX) / (elapsed / 1000);

    lastPointerX = e.clientX;
    lastPointerTime = now;

    normalize();
    render();
  });

  function endDrag(e) {
    if (!dragging || (pointerId !== null && e.pointerId !== pointerId)) return;
    dragging = false;
    try { track.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
    track.style.cursor = 'grab';
  }

  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  track.addEventListener('lostpointercapture', () => {
    dragging = false;
    pointerId = null;
    track.style.cursor = 'grab';
  });

  // Hover pauses the automatic movement, while drag remains available.
  strip.addEventListener('mouseenter', () => {
    if (!dragging) velocity = 0;
    strip.dataset.hover = 'true';
  });

  strip.addEventListener('mouseleave', () => {
    strip.dataset.hover = 'false';
  });

  // Keyboard accessibility: focus the strip and use arrows to move it.
  track.tabIndex = 0;
  track.setAttribute('aria-label', 'Interactive icon strip. Drag horizontally to scroll.');
  track.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      x += 90;
      velocity = 0;
      normalize();
      render();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      x -= 90;
      velocity = 0;
      normalize();
      render();
    } else if (e.key === 'Home') {
      e.preventDefault();
      x = 0;
      velocity = 0;
      render();
    }
  });

  requestAnimationFrame(frame);
})();
</script>
